<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Artemis POS</title>
  <desc id="desc">Vector logo for Artemis point of sale and business management software.</desc>
  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4A5FF"/>
      <stop offset=".48" stop-color="#843BFA"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset=".55" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Symbol -->
  <g transform="translate(0,-5)">
    <path d="M270 300 L390 82 Q405 55 433 55 H470 Q496 55 511 82 L636 300 H548 L450 124 L352 300 Z"
          fill="url(#purple)"/>
    <path d="M204 210 C330 78 570 52 705 145 C605 92 407 117 275 248 C246 277 220 292 190 292"
          fill="none" stroke="url(#gold)" stroke-width="19" stroke-linecap="round"/>
    <path d="M685 117 l12 28 28 12 -28 12 -12 28 -12 -28 -28 -12 28 -12z" fill="#FBBF24"/>
    <!-- Cart integrated into the A -->
    <g transform="translate(377 215)" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 H23 L43 89 H135 L155 25 H36"/>
      <path d="M49 48 H146 M55 68 H140"/>
      <circle cx="62" cy="111" r="8" fill="#FFFFFF" stroke="none"/>
      <circle cx="126" cy="111" r="8" fill="#FFFFFF" stroke="none"/>
    </g>
    <!-- POS terminal -->
    <g transform="translate(642 205)">
      <rect x="0" y="0" width="116" height="83" rx="12" fill="#111827" stroke="#A5B4FC" stroke-width="5"/>
      <rect x="10" y="10" width="96" height="61" rx="7" fill="#F8FAFC"/>
      <rect x="22" y="21" width="31" height="22" rx="5" fill="#0EA5E9"/>
      <rect x="61" y="21" width="31" height="22" rx="5" fill="#10B981"/>
      <rect x="22" y="49" width="31" height="13" rx="4" fill="#8B5CF6"/>
      <rect x="61" y="49" width="31" height="13" rx="4" fill="#F59E0B"/>
      <path d="M38 83 V98 H78 V83" fill="none" stroke="#64748B" stroke-width="7" stroke-linejoin="round"/>
      <path d="M23 101 H93" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="450" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="#111827">
    Artemis <tspan fill="#7C3AED">POS</tspan>
  </text>
  <path d="M180 431 H720" stroke="#DDD6FE" stroke-width="3" stroke-linecap="round"/>
  <text x="450" y="478" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" letter-spacing="2" fill="#475569">
    SMART BUSINESS MANAGEMENT
  </text>
  <text x="450" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#64748B">
    SALES  •  INVENTORY  •  ACCOUNTING  •  AI
  </text>
</svg>
